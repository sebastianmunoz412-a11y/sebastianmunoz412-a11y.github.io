<script>
/* =========================================================
   Los libros se leen de la hoja de Google
   "Libros del sitio el-padrecito.com" (cuenta personal).
   Para añadir un libro, solo agregue una fila en esa hoja.
   ========================================================= */
const SHEET_ID = "12b6vitEHUczVqYSvxGOvb2GVtkXmPLxsuIWoCTOuQQU";
const PALETTE = [["#7a3b2e","#f6e9e0"],["#1f2430","#e6e0d6"],["#dde3da","#24302a"],["#c9a77c","#2a1d10"],["#2f3a2f","#f1e9dc"],["#3b3047","#efe6f2"],["#e9dfd1","#3a2a1c"]];

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true; else if(c==','){row.push(f);f=''} else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)} return rows}
function imgURL(u){u=(u||'').trim(); if(!u) return '';
  const m=u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/);
  return (m && /google\.com/.test(u)) ? 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800' : u}

(async function(){
  const grid=document.getElementById('books'), fl=document.getElementById('filters');
  let lang=document.documentElement.lang||'es', current='*', BOOKS=[];
  grid.innerHTML='<p style="color:var(--muted)">…</p>';
  try{
    const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&t='+Date.now());
    const rows=parseCSV(await r.text()).slice(1).filter(x=>(x[0]||'').trim());
    BOOKS=rows.map((x,i)=>({titulo:x[0],title:x[1],autor:x[2],tema:x[3]||'',theme:x[4],es:x[5],en:x[6],foto:imgURL(x[7]),link:(x[8]||'').trim(),color:PALETTE[i%PALETTE.length][0],tinta:PALETTE[i%PALETTE.length][1]}));
  }catch(e){ grid.innerHTML='<p>No se pudieron cargar los libros. Intente de nuevo más tarde.</p>'; return; }
  function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function render(){
    const themes=[...new Set(BOOKS.map(b=>b.tema).filter(Boolean))];
    fl.innerHTML=[['*',lang==='es'?'Todos':'All']].concat(themes.map(t=>[t, lang==='es'?t:((BOOKS.find(b=>b.tema===t)||{}).theme||t)]))
      .map(([k,l])=>`<button type="button" data-k="${esc(k)}" aria-pressed="${k===current}">${esc(l)}</button>`).join('');
    fl.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.k;render()});
    grid.innerHTML=BOOKS.filter(b=>current==='*'||b.tema===current).map(b=>{
      const ti=lang==='es'?b.titulo:(b.title||b.titulo), tx=lang==='es'?b.es:(b.en||b.es), th=lang==='es'?b.tema:(b.theme||b.tema);
      const more=b.link?`<a class="more" href="${esc(b.link)}" target="_blank" rel="noopener">${lang==='es'?'Conseguir el libro':'Get the book'} →</a>`:'';
      const cover=b.foto?`<div class="cover has-img"><img src="${esc(b.foto)}" alt="${esc(ti)}" loading="lazy" referrerpolicy="no-referrer"></div>`
        :`<div class="cover" style="background:${b.color};color:${b.tinta}"><span class="ct">${esc(ti)}</span><span class="ca">${esc(b.autor)}</span></div>`;
      return `<article class="book">${cover}<span class="au">${esc(b.autor)}${th?' · '+esc(th):''}</span><h3>${esc(ti)}</h3><p>${esc(tx)}</p>${more}</article>`;
    }).join('');
  }
  document.addEventListener('langchange',e=>{lang=e.detail;render()});
  render();
})();
</script>
